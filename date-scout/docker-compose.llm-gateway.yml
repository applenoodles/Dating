# File: docker-compose.llm-gateway.yml
# 一鍵起一個 LiteLLM 金鑰池閘道（OpenAI 相容）。
#
# 用法：
#   1. cp litellm.config.example.yaml litellm.config.yaml   # 視需要調整 model_list
#   2. 在 .env 填好 OPENAI_KEY_1 / OPENAI_KEY_2 / GROQ_KEY / LITELLM_MASTER_KEY
#   3. docker compose -f docker-compose.llm-gateway.yml up -d
#   4. 在 date-scout 的 .env 設：
#        LLM_BASE_URL=http://localhost:4000/v1
#        LLM_API_KEY=${LITELLM_MASTER_KEY}
#        LLM_MODEL=gpt-4.1-mini
#
# 之後申請到的新金鑰只要加進 litellm.config.yaml + .env，重啟容器即可。

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-local-master}
      # 你申請到的各家金鑰；要串幾把就加幾個，並在 config.yaml 對應引用
      - OPENAI_KEY_1=${OPENAI_KEY_1:-}
      - OPENAI_KEY_2=${OPENAI_KEY_2:-}
      - GROQ_KEY=${GROQ_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 5s
      retries: 5
